[package]
name = "caravaiggio"
version = "0.1.0"
description = "Studio for preparing paintings for a brush plotter"
authors = ["Caravaiggio"]
edition = "2021"

[lib]
name = "caravaiggio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
